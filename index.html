<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Latinio">
<title>Latinio · Willkommen</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-brand-180.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top))}main{width:min(100%,400px);padding:32px;background:white;border-radius:24px;box-shadow:0 8px 40px #00000009}.brand{font-size:32px;font-weight:750;letter-spacing:-1.5px}.brand span{color:#6775e7}h1{font-size:23px;margin:30px 0 12px}p{line-height:1.5;color:#64646b}label{display:block;font-weight:600;margin-top:24px}input{display:block;width:100%;font:inherit;font-size:20px;border:1px solid #d2d2d7;border-radius:12px;padding:14px;margin:10px 0 20px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:12px;padding:14px;width:100%;background:#5664dc;color:white;font-weight:600}button:disabled{opacity:.55;cursor:wait}.text{background:transparent;color:#5664dc;margin-top:8px}#status{min-height:24px;font-size:14px}button:focus-visible,input:focus-visible{outline:3px solid #9aa4ff;outline-offset:3px}[hidden]{display:none!important}
</style><script src="./bootstrap.js" defer></script></head>
<body><main><div class="brand">latinio<span>✦</span></div><h1 id="heading">Willkommen bei Latinio</h1><p id="intro">Gib deinen persönlichen vierstelligen Zugangscode ein. Du bekommst ihn vom Admin.</p>
<form id="login" hidden><label id="credential-label" for="credential">Zugangscode</label><input id="credential" name="credential" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required><button id="submit" type="submit">Anmelden</button></form>
<p id="status" role="status" aria-live="polite">Latinio wird geöffnet …</p><button id="toggle" class="text" hidden>Admin-Anmeldung</button><button id="retry" class="text" hidden>Erneut versuchen</button><button id="offline" class="text" hidden>Gespeicherte App öffnen</button>
<noscript>Bitte aktiviere JavaScript, um Latinio zu verwenden.</noscript></main></body></html>
