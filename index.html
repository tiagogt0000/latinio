<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7"><meta name="description" content="Latein und Englisch lernen. Kleine Runden, passende Wiederholungen und dein eigener Lernfortschritt.">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Latinio">
  <title>Latinio · Latein lernen</title>
  <link rel="icon" href="./icon.svg?v=2.14.0" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="./icon-brand-180.png?v=2.14.0"><link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app/style.css">
  <link rel="stylesheet" href="./app/streak-demo.css">
  <link rel="stylesheet" href="./app/grammar.css">
  <link rel="stylesheet" href="./app/table-practice.css">
  <link rel="stylesheet" href="./app/apple-design.css">
  <link rel="stylesheet" href="./app/apple-learning.css">
  <link rel="stylesheet" href="./app/liquid-glass.css">
  <link rel="stylesheet" href="./app/apple-motion.css">
</head>
<body><div id="app"><main class="boot"><div class="brand">latinio<span>✦</span></div><p>Deine Vokabeln werden geladen …</p></main></div><div id="modal-root"></div><div id="toast" role="status" aria-live="polite"></div><script>
(()=>{const app=document.getElementById('app');const stuck=()=>app.querySelector('.boot')?.textContent.includes('Deine Vokabeln werden geladen');const show=()=>{if(!stuck())return;app.innerHTML='<main class="boot"><h1>Latinio startet nicht weiter.</h1><p>Schließe andere Latinio-Fenster und lade die App erneut. Deine gespeicherten Lernstände bleiben erhalten.</p><button class="button primary" onclick="location.reload()">Erneut laden</button></main>';};window.addEventListener('error',()=>{if(stuck())show();},true);setTimeout(show,20000);if('serviceWorker'in navigator&&location.protocol!=='file:'){const activate=worker=>{if(!worker||!stuck()||!navigator.serviceWorker.controller)return;navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload(),{once:true});worker.postMessage({type:'ACTIVATE_UPDATE'});};const watch=registration=>{const worker=registration.installing;if(!worker)return;const check=()=>{if(worker.state==='installed')activate(registration.waiting);};worker.addEventListener('statechange',check);check();};navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(registration=>{registration.addEventListener('updatefound',()=>watch(registration));watch(registration);activate(registration.waiting);void registration.update().catch(()=>{});}).catch(()=>{});}})();
</script><script type="module" src="./app/main.js"></script><noscript>Bitte aktiviere JavaScript, um Latinio zu verwenden.</noscript></body>
</html>
