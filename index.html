<!doctype html>
<html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Latinio">
<title>Latinio · Willkommen</title>
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-brand-180.png">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7;color-scheme:light dark}html{background:white}@media(prefers-color-scheme:dark){html{background:#000}body{color:#f5f5f7}body main{background:#1c1c1e}body p{color:#bbb}}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;padding-top:max(24px,env(safe-area-inset-top))}main{width:min(100%,400px);padding:32px;background:white;border-radius:24px;box-shadow:0 8px 40px #00000009}.brand{font-size:32px;font-weight:750;letter-spacing:-1.5px}.brand span{color:#6775e7}h1{font-size:23px;margin:30px 0 12px}p{line-height:1.5;color:#64646b}label{display:block;font-weight:600;margin-top:24px}input{display:block;width:100%;font:inherit;font-size:20px;border:1px solid #d2d2d7;border-radius:12px;padding:14px;margin:10px 0 20px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:12px;padding:14px;width:100%;background:#5664dc;color:white;font-weight:600}button:disabled{opacity:.55;cursor:wait}.text{background:transparent;color:#5664dc;margin-top:8px}#status{min-height:24px;font-size:14px}button:focus-visible,input:focus-visible{outline:3px solid #9aa4ff;outline-offset:3px}#online-entry,#boot-retry{display:block;text-align:center;padding:14px;border-radius:12px;text-decoration:none}#boot-retry:focus-visible{outline:3px solid #9aa4ff;outline-offset:3px}[hidden]{display:none!important}
</style><script src="./bootstrap.js?v=2.28.0" defer onerror="window.latinioBootFailed=true;if(window.latinioBootFailure)window.latinioBootFailure()"></script></head>
<body><main id="gate-panel" hidden><div class="brand">latinio<span>✦</span></div><h1 id="heading">Willkommen bei Latinio</h1><p id="intro">Gib deinen persönlichen vierstelligen Zugangscode ein. Du bekommst ihn vom Admin.</p>
<form id="login" method="post" hidden><label id="credential-label" for="credential">Zugangscode</label><input id="credential" name="credential" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required><button id="submit" type="submit">Anmelden</button></form>
<p id="status" role="status" aria-live="polite"></p><button id="toggle" class="text" hidden>Admin-Anmeldung</button><button id="retry" class="text" hidden>Erneut versuchen</button><button id="offline" class="text" hidden>Offline App öffnen</button>
<a id="online-entry" class="text" href="https://elektrogilbersserver.tail7c7157.ts.net/latinio/" hidden>Latinio auf dem Lernserver öffnen</a>
<a id="boot-retry" class="text" href="./?gate=1" hidden>Erneut versuchen</a>
<noscript><style>#gate-panel[hidden]{display:block!important}</style>Bitte aktiviere JavaScript, um Latinio zu verwenden. <a href="./?gate=1">Erneut versuchen</a></noscript></main>
<script data-bootstrap-recovery>
(()=>{let ready=false;const retry=document.getElementById('boot-retry');
const recover=()=>{if(ready)return;document.getElementById('gate-panel').hidden=false;document.getElementById('status').textContent='Die Startseite konnte nicht vollständig geladen werden. Bitte erneut versuchen.';retry.hidden=false;};
const timer=setTimeout(recover,6000);
window.latinioBootFailure=recover;
window.latinioBootReady=()=>{ready=true;clearTimeout(timer);retry.hidden=true;};
if(window.latinioBootFailed)recover();})();
</script></body></html>
