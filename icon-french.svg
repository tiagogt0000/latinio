  <rect width="512" height="512" fill="url(#color)"/>
  <rect width="512" height="512" fill="url(#light)"/>
  <rect width="512" height="512" fill="url(#refraction)"/>
  <rect x="40" y="48" width="432" height="432" rx="110" fill="#122b49" opacity=".17" filter="url(#lens-shadow)"/>
  <rect x="40" y="36" width="432" height="432" rx="110" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(0 5)" opacity=".15">
    <use href="#letter" fill="none" stroke="#122b49" stroke-width="56" stroke-linecap="round"/>
    <use href="#spark" fill="#122b49"/>
  </g>
  <use href="#letter" fill="none" stroke="url(#glyph)" stroke-width="56" stroke-linecap="round"/>
